name: Decommission Runner

on:
  workflow_dispatch:
    inputs:
      runner_name:
        description: 'Name of the runner to decommission (e.g. gh-runner-01)'
        required: true
        type: string

jobs:
  decommission:
    name: Mark for Cleanup
    runs-on: self-hosted
    env:
      PROXMOX_HOST: ${{ secrets.PROXMOX_HOST }}
      PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
      PROXMOX_PASSWORD: ${{ secrets.PROXMOX_PASSWORD }}
      RUNNER_NAME: ${{ github.event.inputs.runner_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        env:
          TF_DB_USER: ${{ vars.TF_DB_USER }}
          TF_DB_PASSWORD: ${{ secrets.TF_DB_PASSWORD }}
          TF_DB_HOST: ${{ vars.TF_DB_HOST }}
          TF_DB_PORT: ${{ vars.TF_DB_PORT }}
          TF_DB_NAME: ${{ vars.TF_DB_NAME }}
          TF_STATE_CONN_VAR: ${{ vars.TF_STATE_CONN }}
        run: |
          cd terraform/environments/production
          export TF_STATE_CONN=$(echo "$TF_STATE_CONN_VAR" | envsubst)
          terraform init -backend-config="conn_str=$TF_STATE_CONN"

      - name: Install Dependencies
        run: |
          if ! command -v ansible-playbook &> /dev/null || ! command -v envsubst &> /dev/null || ! command -v jq &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ansible gettext jq python3-pip
          fi
          # Ensure Python dependencies for community.proxmox are present
          pip3 install --user proxmoxer requests
          ansible-galaxy collection install community.proxmox

      - name: Mark for Decommissioning
        env:
          GH_PAT: ${{ secrets.GH_RUNNER_PAT }}
          GH_ORG: ${{ secrets.GH_ORG }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > runner_key
          chmod 600 runner_key
          export ANSIBLE_HOST_KEY_CHECKING=False

          cd terraform/environments/production
          RUNNER_DETAILS=$(terraform output -json runner_details)
          RUNNER_IP=$(echo "$RUNNER_DETAILS" | jq -r --arg NAME "${{ github.event.inputs.runner_name }}" '.[$NAME].ip')
          
          if [ "$RUNNER_IP" == "null" ]; then
            echo "Error: Could not find IP for ${{ github.event.inputs.runner_name }}"
            exit 1
          fi

          cd ../../../ansible
          echo "${{ github.event.inputs.runner_name }} ansible_host=$RUNNER_IP ansible_user=runner" > temp_host.ini
          
          ansible-playbook -i temp_host.ini playbooks/site.yml \
            --private-key ../runner_key \
            -e "lifecycle_action=quiesce" \
            -e "github_pat=$GH_PAT" \
            -e "github_org=$GH_ORG" \
            -e "project_root=$GITHUB_WORKSPACE"
          
          rm ../runner_key

      - name: Next Steps
        run: |
          echo "### ✅ Runner Marked for Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "The runner \`${{ github.event.inputs.runner_name }}\` has been labeled in Proxmox and removed from Terraform state." >> $GITHUB_STEP_SUMMARY
          echo "Please ensure you remove this runner from \`terraform/terraform.tfvars\` to keep the code in sync." >> $GITHUB_STEP_SUMMARY
