name: Deploy Proxmox GitHub Runners

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: self-hosted
    outputs:
      plan_exists: ${{ steps.plan.outputs.plan_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Format check
        run: cd terraform && terraform fmt -check

      - name: Terraform Validate
        run: cd terraform && terraform validate

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_pm_api_url: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_pm_user: ${{ secrets.PROXMOX_USER }}
          TF_VAR_pm_password: ${{ secrets.PROXMOX_PASSWORD }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cd terraform
          terraform plan -no-color -out=tfplan > plan_output.txt
          echo "plan_exists=true" >> $GITHUB_OUTPUT
          
          # Prepare plan for PR comment
          echo "PLAN<<PLAN_EOF" >> $GITHUB_ENV
          terraform show -no-color tfplan >> $GITHUB_ENV
          echo "PLAN_EOF" >> $GITHUB_ENV

      - name: Upload Plan & State
        uses: actions/upload-artifact@v4
        with:
          name: tf-artifacts-${{ github.sha }}
          path: |
            terraform/tfplan
            terraform/.terraform.lock.hcl
            terraform/terraform.tfstate
          retention-days: 1

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ env.PLAN }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const plan = process.env.PLAN || 'No plan output captured.';
            const output = `#### Terraform Plan 📖
            
            <details><summary>Show Plan</summary>
            
            \`\`\`hcl
            ${plan}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  apply:
    name: Terraform Apply
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    outputs:
      runner_details: ${{ steps.output.outputs.runner_details }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Download Plan & State
        uses: actions/download-artifact@v4
        with:
          name: tf-artifacts-${{ github.sha }}
          path: terraform

      - name: Terraform Init
        run: cd terraform && terraform init

      - name: Terraform Apply
        env:
          TF_VAR_pm_api_url: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_pm_user: ${{ secrets.PROXMOX_USER }}
          TF_VAR_pm_password: ${{ secrets.PROXMOX_PASSWORD }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cd terraform
          terraform apply -auto-approve tfplan

      - name: Capture Outputs
        id: output
        run: |
          cd terraform
          RUNNER_DETAILS=$(terraform output -json runner_details | jq -c .)
          echo "runner_details=$RUNNER_DETAILS" >> $GITHUB_OUTPUT

      - name: Terraform Failure Summary
        if: failure()
        run: |
          echo "### ❌ Terraform Apply Failed" >> $GITHUB_STEP_SUMMARY
          echo "The infrastructure state may be inconsistent. Check the Proxmox UI for partially provisioned VMs." >> $GITHUB_STEP_SUMMARY

  configure:
    name: Ansible Configure
    needs: apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      GH_PAT: ${{ secrets.GH_RUNNER_PAT }}
      GH_ORG: ${{ secrets.GH_ORG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Inventory
        env:
          RUNNER_DETAILS: ${{ needs.apply.outputs.runner_details }}
        run: |
          cd ansible
          echo "[github_runners]" > hosts.ini
          echo "$RUNNER_DETAILS" | jq -r 'to_entries[] | "\(.key) ansible_host=\(.value.ip) proxmox_node=\(.value.node)"' >> hosts.ini
          echo "" >> hosts.ini
          echo "[github_runners:vars]" >> hosts.ini
          echo "ansible_user=runner" >> hosts.ini

      - name: Run Ansible
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cd ansible
          echo "$SSH_PRIVATE_KEY" > runner_key
          chmod 600 runner_key
          
          # SRE Best Practice: Use a pipelined approach for Ansible in CI
          export ANSIBLE_HOST_KEY_CHECKING=False
          export ANSIBLE_FORCE_COLOR=True
          
          ansible-playbook -i hosts.ini site.yml \
            --private-key runner_key \
            --extra-vars "GH_PAT=$GH_PAT GH_ORG=$GH_ORG"
          
          rm runner_key

      - name: Ansible Failure Summary
        if: failure()
        run: |
          echo "### ❌ Ansible Configuration Failed" >> $GITHUB_STEP_SUMMARY
          echo "Rollout halted due to 'any_errors_fatal: true'. Remaining runners are untouched." >> $GITHUB_STEP_SUMMARY
