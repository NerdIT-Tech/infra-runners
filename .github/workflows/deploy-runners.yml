name: Deploy Proxmox GitHub Runners

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate & Plan
    runs-on: self-hosted # Using the local runner mentioned by the user
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.PROXMOX_API_URL }}" ] && MISSING="$MISSING PROXMOX_API_URL"
          [ -z "${{ secrets.PROXMOX_USER }}" ] && MISSING="$MISSING PROXMOX_USER"
          [ -z "${{ secrets.PROXMOX_PASSWORD }}" ] && MISSING="$MISSING PROXMOX_PASSWORD"
          [ -z "${{ secrets.SSH_PUBLIC_KEY }}" ] && MISSING="$MISSING SSH_PUBLIC_KEY"
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && MISSING="$MISSING SSH_PRIVATE_KEY"
          
          if [ ! -z "$MISSING" ]; then
            echo "::error::The following secrets are missing or empty: $MISSING"
            echo "::notice::GitHub Secrets are NOT available to Pull Requests from forks for security reasons. If this is a fork, you must run the workflow from a branch in the main repository or use a local environment."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: cd terraform && terraform init

      - name: Terraform Format check
        run: cd terraform && terraform fmt -check

      - name: Terraform Validate
        run: cd terraform && terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          cd terraform
          # Run plan and capture all output (stdout + stderr)
          terraform plan -no-color \
            -var="pm_api_url=${{ secrets.PROXMOX_API_URL }}" \
            -var="pm_user=${{ secrets.PROXMOX_USER }}" \
            -var="pm_password=${{ secrets.PROXMOX_PASSWORD }}" \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var="ssh_private_key=${{ secrets.SSH_PRIVATE_KEY }}" \
            -out=tfplan > tfplan_raw.txt 2>&1 || export PLAN_FAILED=true
          
          if [ -f tfplan ]; then
            terraform show -no-color tfplan > plan_output.txt
          else
            cat tfplan_raw.txt > plan_output.txt
          fi
          
          # Use a more unique delimiter for multiline strings
          echo "PLAN<<PLAN_EOF" >> $GITHUB_ENV
          cat plan_output.txt >> $GITHUB_ENV
          echo "PLAN_EOF" >> $GITHUB_ENV
          
          if [ "$PLAN_FAILED" = "true" ]; then
            exit 1
          fi
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ env.PLAN }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const plan = process.env.PLAN || 'No plan output captured.';
            const output = `#### Terraform Format and Style 🖌
            #### Terraform Initialization ⚙️
            #### Terraform Validation 🤖
            #### Terraform Plan 📖
            
            <details><summary>Show Plan</summary>
            
            \`\`\`hcl
            ${plan}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  deploy:
    name: Apply & Configure
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      GH_PAT: ${{ secrets.GH_RUNNER_PAT }}
      GH_ORG: ${{ secrets.GH_ORG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible jq

      - name: Run Deployment Script
        run: |
          chmod +x scripts/setup-runners.sh
          ./scripts/setup-runners.sh
        env:
          TF_VAR_pm_api_url: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_pm_user: ${{ secrets.PROXMOX_USER }}
          TF_VAR_pm_password: ${{ secrets.PROXMOX_PASSWORD }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
