name: Janitor Cleanup
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ansible
        run: pip install ansible community.general

      - name: Run Janitor Playbook
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_PAT }}
          GH_ORG: ${{ secrets.GH_ORG }}
          PROXMOX_HOST: ${{ secrets.PROXMOX_API_URL }}
          PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
          PROXMOX_PASSWORD: ${{ secrets.PROXMOX_PASSWORD }}
        run: ansible-playbook ansible/janitor.yml
