name: Infrastructure Janitor

on:
  schedule:
    - cron: '0 2 * * *' # Run at 02:00 UTC every day
  workflow_dispatch: # Allow manual trigger

jobs:
  cleanup:
    name: Background Cleanup
    runs-on: self-hosted
    env:
      PROXMOX_HOST: ${{ secrets.PROXMOX_HOST }}
      PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
      PROXMOX_TOKEN: ${{ secrets.PROXMOX_TOKEN }}
      PROXMOX_PASSWORD: ${{ secrets.PROXMOX_PASSWORD }} # Needed for some Ansible modules
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          if ! command -v ansible-playbook &> /dev/null || ! command -v envsubst &> /dev/null || ! command -v jq &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ansible gettext jq python3-pip
          fi
          # Ensure Python dependencies for community.proxmox are present
          pip3 install --user proxmoxer requests
          ansible-galaxy collection install community.proxmox

      - name: Run Janitor
        run: |
          cd ansible
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook playbooks/janitor.yml
