---
- name: Janitor Background Cleanup
  hosts: localhost
  tasks:
    - name: Get all Proxmox nodes
      uri:
        url: "https://{{ lookup('env', 'PROXMOX_HOST') }}:8006/api2/json/nodes"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ lookup('env', 'PROXMOX_USER') }}={{ lookup('env', 'PROXMOX_TOKEN') }}"
        validate_certs: no
      register: nodes_res

    - name: Find VMs with janitor tag on each node
      uri:
        url: "https://{{ lookup('env', 'PROXMOX_HOST') }}:8006/api2/json/nodes/{{ item.node }}/qemu"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ lookup('env', 'PROXMOX_USER') }}={{ lookup('env', 'PROXMOX_TOKEN') }}"
        validate_certs: no
      loop: "{{ nodes_res.json.data }}"
      register: vms_res

    - name: Identify VMs for deletion
      set_fact:
        vms_to_nuke: >-
          {% set vms = [] %}
          {% for node_vms in vms_res.results %}
            {% for vm in node_vms.json.data %}
              {% if 'janitor:cleanup' in (vm.tags | default('')) %}
                {% set _ = vms.append({'vmid': vm.vmid, 'node': node_vms.item.node, 'name': vm.name}) %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ vms }}

    - name: Nuke marked VMs
      proxmox_kvm:
        api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
        api_user: "{{ lookup('env', 'PROXMOX_USER') }}"
        api_password: "{{ lookup('env', 'PROXMOX_PASSWORD') }}"
        vmid: "{{ item.vmid }}"
        node: "{{ item.node }}"
        state: absent
      loop: "{{ vms_to_nuke }}"
      when: vms_to_nuke | length > 0

    - name: Summary
      debug:
        msg: "Cleaned up {{ vms_to_nuke | length }} VMs marked for decommissioning."
