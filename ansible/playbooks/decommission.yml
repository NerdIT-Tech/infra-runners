---
- name: Mark Runner for Decommissioning
  hosts: localhost
  vars:
    runner_name: "{{ lookup('env', 'RUNNER_NAME') }}"
    project_root: "/workspaces/infra-runners"
  tasks:
    - name: Get Terraform State
      command: terraform show -json
      args:
        chdir: "{{ project_root }}/terraform"
      register: tf_state
      changed_when: false

    - name: Identify Runner Resource
      set_fact:
        runner_resource: >-
          {{ 
            (tf_state.stdout | from_json).values.root_module.child_modules 
            | selectattr('address', 'search', 'module.gh_runners') 
            | map(attribute='resources') | flatten 
            | selectattr('values.name', 'equalto', runner_name)
            | first | default(none)
          }}

    - name: Fail if runner not found
      fail:
        msg: "Runner {{ runner_name }} not found in Terraform state."
      when: runner_resource is none

    - name: Disable runner service (if reachable)
      delegate_to: "{{ runner_name }}"
      systemd:
        name: "actions.runner.{{ lookup('env', 'GH_ORG') }}.{{ runner_name }}.service"
        state: stopped
        enabled: no
      ignore_errors: true
      vars:
        ansible_host: "{{ runner_resource.values.ip_address | default(runner_resource.values.ip) }}"
        ansible_user: "runner"
      when: (runner_resource.values.ip_address | default(runner_resource.values.ip)) is defined
      
    - name: Remove from Terraform State
      command: "terraform state rm {{ runner_resource.address }}"
      args:
        chdir: "{{ project_root }}/terraform"
      
    - name: Summary
      debug:
        msg: "SUCCESS: {{ runner_name }} is marked for cleanup."
