---
- name: Skip hosts that do not require quiescing
  meta: end_host
  when: >
    not org['cleanup-policy'] == 'ephemeral' and
    (org['expires-at'] | default('9999-01-01')) < ansible_date_time.iso8601

- name: Remove VM from Terraform state
  command: >
    terraform state rm
    proxmox_vm_qemu.{{ org['service'] }}["{{ inventory_hostname }}"]
  args:
    chdir: "{{ project_root }}/terraform"
  environment:
    TF_IN_AUTOMATION: "true"

- name: Check for service-specific quiesce playbook
  stat:
    path: "{{ playbook_dir }}/{{ org['service'] }}.yml"
  register: quiesce_playbook

- name: Run service-specific quiesce
  import_playbook: "{{ org['service'] }}.yml"
  when: quiesce_playbook.stat.exists

- name: Default quiesce — stop VM gracefully
  community.proxmox.proxmox_kvm:
    api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    api_user: "{{ (lookup('env', 'PROXMOX_USER') | split('!'))[0] }}"
    api_token_id: "{{ (lookup('env', 'PROXMOX_USER') | split('!'))[1] }}"
    api_token_secret: "{{ lookup('env', 'PROXMOX_PASSWORD') }}"
    api_password: ""
    vmid: "{{ org['vmid'] }}"
    node: "{{ org['node'] }}"
    state: stopped
  when: not quiesce_playbook.stat.exists

- name: Tag for retirement
  community.proxmox.proxmox_kvm:
    api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    api_user: "{{ (lookup('env', 'PROXMOX_USER') | split('!'))[0] }}"
    api_token_id: "{{ (lookup('env', 'PROXMOX_USER') | split('!'))[1] }}"
    api_token_secret: "{{ lookup('env', 'PROXMOX_PASSWORD') }}"
    api_password: ""
    vmid: "{{ org['vmid'] }}"
    node: "{{ org['node'] }}"
    tags: "cleanup=true"
    state: present
