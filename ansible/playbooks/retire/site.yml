---
- name: Retire | Destroy resources marked for cleanup
  hosts: all
  gather_facts: false
  tags: retire

  tasks:

    - name: Skip hosts that do not require retirement
      meta: end_host
      when: not (org['org:cleanup'] | default('false') == 'true')

    - name: Check for service-specific retirement playbook
      stat:
        path: "{{ playbook_dir }}/{{ org['org:service'] }}.yml"
      register: retire_playbook

    - name: Run service-specific retirement playbook
      import_playbook: "{{ org['org:service'] }}.yml"
      when: retire_playbook.stat.exists

    - name: Ensure VM is stopped before deletion
      proxmox_kvm:
        api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
        api_user: "{{ lookup('env', 'PROXMOX_USER') }}"
        api_password: "{{ lookup('env', 'PROXMOX_PASSWORD') }}"
        vmid: "{{ org['org:vmid'] }}"
        node: "{{ org['org:node'] }}"
        state: stopped
      register: stop_result
      failed_when: false

    - name: Delete VM from Proxmox
      proxmox_kvm:
        api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
        api_user: "{{ lookup('env', 'PROXMOX_USER') }}"
        api_password: "{{ lookup('env', 'PROXMOX_PASSWORD') }}"
        vmid: "{{ org['org:vmid'] }}"
        node: "{{ org['org:node'] }}"
        state: absent
      register: deletion_result

    - name: List Proxmox backups for VM
      uri:
        url: "https://{{ lookup('env', 'PROXMOX_HOST') }}:{{ lookup('env', 'PROXMOX_PORT') }}/api2/json/nodes/{{ org['org:node'] }}/storage/local/content"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ lookup('env', 'PROXMOX_USER') }}={{ lookup('env', 'PROXMOX_TOKEN') }}"
        validate_certs: false
      register: backup_list

    - name: Delete backups belonging to this VM
      uri:
        url: "https://{{ lookup('env', 'PROXMOX_HOST') }}:{{ lookup('env', 'PROXMOX_PORT') }}/api2/json/nodes/{{ org['org:node'] }}/storage/local/content/{{ item.volid }}"
        method: DELETE
        headers:
          Authorization: "PVEAPIToken={{ lookup('env', 'PROXMOX_USER') }}={{ lookup('env', 'PROXMOX_TOKEN') }}"
        validate_certs: false
      loop: "{{ backup_list.json.data | selectattr('vmid', 'equalto', org['org:vmid'] | int) | list }}"
      when: backup_list.json.data is defined
