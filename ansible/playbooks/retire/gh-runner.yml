---
- name: "Log retirement for {{ inventory_hostname }}"
  debug:
    msg: "Executing final retirement for GitHub Runner {{ inventory_hostname }} (VMID: {{ org.vmid }}) on node {{ org.node }}"

# ---------------------------------------------------------------
# Verify runner was deregistered in quiesce
# ---------------------------------------------------------------
- name: "Query GitHub for existing runners"
  uri:
    url: "https://api.github.com/orgs/{{ lookup('env', 'GH_ORG') }}/actions/runners"
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('env', 'GH_PAT') }}"
      Accept: "application/vnd.github+json"
    return_content: true
  register: gh_runners
  delegate_to: localhost
  failed_when: false

- name: "Check if runner {{ inventory_hostname }} still exists"
  set_fact:
    runner_still_exists: >-
      {{
        gh_runners.json.runners
        | selectattr('name', 'equalto', inventory_hostname)
        | list
        | length > 0
      }}
  when: gh_runners.json.runners is defined

- name: "Fail if runner still exists (quiesce did not complete)"
  fail:
    msg: "GitHub runner {{ inventory_hostname }} still exists — quiesce did not deregister it."
  when: runner_still_exists | default(false)

- name: "Confirm runner was deregistered"
  debug:
    msg: "Runner {{ inventory_hostname }} is no longer registered in GitHub. Proceeding with retirement."
