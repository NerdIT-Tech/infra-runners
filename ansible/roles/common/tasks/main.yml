---
- name: Ensure minimal dependencies are present
  apt:
    name:
      - curl
      - git
      - jq
      - unzip
      - build-essential
      - libssl-dev
      - libffi-dev
      - python3-pip
      - ca-certificates
      - gnupg
      - ufw
      - acl
    state: present
    update_cache: yes
  become: true

- name: Apply SRE Kernel Tuning
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop: "{{ sysctl_settings | dict2items }}"
  become: true

- name: Allow SSH in UFW
  ufw:
    rule: allow
    port: "22"
    proto: tcp
  become: true
  when: ufw_enabled

- name: Set default UFW policies
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
    state: enabled
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }
  become: true
  when: ufw_enabled

- name: Setup Node.js Repository (v{{ node_version }})
  block:
    - name: Create directory for NodeSource GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add NodeSource GPG key
      get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: '0644'

    - name: Add NodeSource repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_version }}.x nodistro main"
        state: present
        filename: nodesource

    - name: Install nodejs
      apt:
        name: nodejs
        state: present
  become: true
