---
- name: Ensure minimal dependencies are present
  apt:
    name:
      #- "{{ common_packages }}"
      - cloud-guest-utils
      - lvm2
    state: present
    update_cache: yes
  become: true

- name: SRE | Auto-expand LVM and Filesystem
  block:
    - name: Grow the partition to fill the disk
      command: growpart /dev/sda 3
      register: growpart_res
      failed_when: false
      changed_when: growpart_res.rc == 0

    - name: Resize Physical Volume
      command: pvresize /dev/sda 3
      when: growpart_res.rc == 0 or "NOCHANGE" in growpart_res.stdout
      changed_when: true

    - name: Extend Logical Volume to 100% FREE
      community.general.lvol:
        lv: /dev/ubuntu-vg/ubuntu-lv
        size: +100%FREE
        resizefs: yes
      ignore_errors: true

- name: Apply SRE Kernel Tuning
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop: "{{ common_sysctl_settings | dict2items }}"
  become: true

- name: Allow SSH in UFW
  ufw:
    rule: allow
    port: "{{ common_ssh_port }}"
    proto: tcp
  become: true
  when: common_ufw_enabled

- name: Set default UFW policies
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
    state: enabled
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }
  become: true
  when: common_ufw_enabled

- name: Setup Node.js Repository (v{{ common_node_version }})
  block:
    - name: Create directory for NodeSource GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add NodeSource GPG key
      get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: '0644'

    - name: Add NodeSource repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ common_node_version }}.x nodistro main"
        state: present
        filename: nodesource

    - name: Install nodejs
      apt:
        name: nodejs
        state: present
  become: true
