version: '3.8'
services:
  infra-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    network_mode: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    userns_mode: keep-id
    command: /bin/sh -c "while sleep 1000; do :; done"
